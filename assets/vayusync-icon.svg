<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="favFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Wind Stream Gradient -->
    <linearGradient id="favWind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Orbital Radar Arc -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3"/>

  <!-- Flowing Wind Vortex Arc -->
  <path d="M 26 66 C 30 38, 56 26, 80 30 C 100 34, 110 52, 102 68 C 96 78, 84 84, 72 80 C 54 74, 56 56, 74 52"
        fill="none" stroke="url(#favWind)" stroke-width="5" stroke-linecap="round" filter="url(#favGlow)"/>

  <!-- Central Thermal Energy Kernel -->
  <path d="M 64 96 C 54 96, 46 86, 50 74 C 54 62, 64 48, 64 36 C 65 48, 80 58, 78 72 C 76 86, 72 96, 64 96 Z"
        fill="url(#favFlame)" filter="url(#favGlow)"/>

  <path d="M 64 92 C 58 92, 54 84, 56 76 C 58 68, 64 58, 64 48 C 65 58, 72 66, 70 76 C 69 84, 67 92, 64 92 Z"
        fill="#fef08a" opacity="0.95"/>

  <!-- Satellite Sensor Node -->
  <circle cx="64" cy="36" r="2.5" fill="#fef08a"/>
  <circle cx="80" cy="30" r="2" fill="#38bdf8"/>
</svg>
