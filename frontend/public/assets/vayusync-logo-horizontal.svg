<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Flame Gradient -->
    <linearGradient id="hzFireGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Wind Gradient -->
    <linearGradient id="hzWindGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Outer Emblem Glow -->
    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── ICON MARK (Left, Centered at x=100, y=100) ── -->
  <g transform="translate(10, 10)">
    <!-- Radar Ring -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="4 5"/>
    <circle cx="90" cy="90" r="54" fill="none" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="3 4"/>

    <!-- Wind Vortex Stream -->
    <path d="M 35 90 C 45 50, 80 35, 110 40 C 140 46, 155 70, 145 92 C 140 106, 125 115, 108 110 C 82 102, 85 75, 112 68"
          fill="none" stroke="url(#hzWindGrad)" stroke-width="6.5" stroke-linecap="round" filter="url(#hzGlow)"/>

    <!-- Thermal Flame Core -->
    <path d="M 90 135 C 78 135, 68 122, 72 106 C 76 90, 90 74, 90 58 C 92 74, 112 88, 110 108 C 108 124, 100 135, 90 135 Z"
          fill="url(#hzFireGrad)" filter="url(#hzGlow)"/>

    <!-- Hotspot Radiant Kernel -->
    <path d="M 90 130 C 84 130, 78 122, 81 112 C 84 100, 90 88, 90 76 C 91 88, 100 100, 98 113 C 97 123, 94 130, 90 130 Z"
          fill="#fef08a" opacity="0.95"/>

    <circle cx="90" cy="58" r="2.5" fill="#fef08a"/>
    <circle cx="110" cy="40" r="2" fill="#38bdf8"/>
  </g>

  <!-- ── TYPOGRAPHY WORDMARK ── -->
  <!-- Vayu (White, Clean, Modern Sans) -->
  <text x="210" y="112" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif"
        font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Vayu</text>

  <!-- Sync (Radiant Flame Accent) -->
  <text x="365" y="112" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif"
        font-size="64" font-weight="900" fill="#f97316" letter-spacing="-1.5">Sync</text>

  <!-- Subtitle / Tagline -->
  <text x="212" y="148" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif"
        font-size="14.5" font-weight="700" fill="#94a3b8" letter-spacing="3.5">HYPERLOCAL AIR SAFETY ENGINE</text>

  <!-- Status / Domain Capsule -->
  <g transform="translate(685, 84)">
    <rect width="64" height="24" rx="12" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="12" cy="12" r="3.5" fill="#22c55e"/>
    <text x="23" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="1">LIVE</text>
  </g>
</svg>
